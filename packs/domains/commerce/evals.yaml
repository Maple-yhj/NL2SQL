    expectedDimensions: [commerce.Seller.state, commerce.OrderItem.shipping_limit_at]
    expectedFields: []
    time: {field: commerce.OrderItem.shipping_limit_at, grain: year, start: "2017-01-01", end: "2019-01-01"}
    calculations: [{id: commerce.yearly_gmv_change, operation: growth, inputs: [commerce.gmv], partitionBy: [commerce.Seller.state]}]
    ordering: [{ref: commerce.Seller.state, direction: asc}, {ref: commerce.OrderItem.shipping_limit_at, direction: asc}]
    expectedGrain: [commerce.Seller.state, commerce.OrderItem.shipping_limit_at]
