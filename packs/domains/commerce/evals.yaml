evals:
  - id: commerce.metric_001
    question: 统计 2018 年每个月的 GMV 趋势
    analysisType: trend
    expectedMetrics: [commerce.gmv]
    expectedEntities: [commerce.OrderItem]
    expectedDimensions: [commerce.OrderItem.shipping_limit_at]
    expectedFields: []
    time: {field: commerce.OrderItem.shipping_limit_at, grain: month, start: "2018-01-01", end: "2019-01-01"}
    ordering: [{ref: commerce.OrderItem.shipping_limit_at, direction: asc}]
    expectedGrain: [commerce.OrderItem.shipping_limit_at]
    context: {mode: standalone, tenantScope: all}
