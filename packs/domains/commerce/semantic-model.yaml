entities:
  commerce.Order:
    grain: [order_id]
    description: 每个订单一条记录
    fields:
      order_id:
        type: string
        nullable: false
        description: 订单标识
      customer_id:
        type: string
        nullable: false
        description: 下单客户标识
      status:
        type: string
        nullable: false
        description: 订单当前状态
      purchased_at:
        type: datetime
        nullable: false
        timeSemantics: 订单购买事件时间
      approved_at:
        type: datetime
        timeSemantics: 订单审批事件时间
      carrier_handoff_at:
        type: datetime
        timeSemantics: 订单交给承运商的事件时间
      delivered_at:
        type: datetime
        timeSemantics: 订单实际送达事件时间
      estimated_delivery_at:
        type: datetime
        timeSemantics: 订单预计送达时间

  commerce.OrderItem:
    grain: [order_id, item_sequence]
    description: 每个订单商品项一条记录
    fields:
      order_id:
        type: string
        nullable: false
        description: 所属订单标识
      item_sequence:
        type: integer
        nullable: false
        description: 商品项在订单内的序号
      product_id:
        type: string
        nullable: false
        description: 商品标识
      seller_id:
        type: string
        nullable: false
        description: 卖家标识
      shipping_limit_at:
        type: datetime
        nullable: false
        timeSemantics: 商品项发货截止事件时间
      item_price:
        type: decimal
        nullable: false
        unit: money
        description: 商品项价格
      freight_amount:
        type: decimal
        nullable: false
        unit: money
        description: 商品项运费金额

  commerce.Customer:
    grain: [customer_id]
    description: 每个客户一条记录
    fields:
      customer_id:
        type: string
        nullable: false
        description: 客户标识
      person_id:
        type: string
        nullable: false
        description: 跨订单保持稳定的客户身份标识
      city:
        type: string
        description: 客户所在城市
      state:
        type: string
        description: 客户所在州
      postal_code_prefix:
        type: string
        description: 客户邮编前缀

  commerce.Seller:
    grain: [seller_id]
    description: 每个卖家一条记录
    fields:
      seller_id:
        type: string
        nullable: false
        description: 卖家标识
      city:
        type: string
        description: 卖家所在城市
      state:
        type: string
        description: 卖家所在州
      postal_code_prefix:
        type: string
        description: 卖家邮编前缀

  commerce.Product:
    grain: [product_id]
    description: 每个商品一条记录
    fields:
      product_id:
        type: string
        nullable: false
        description: 商品标识
      category_code:
        type: string
        description: 商品品类编码或名称
      name_length:
        type: integer
        unit: characters
        description: 商品名称长度
      description_length:
        type: integer
        unit: characters
        description: 商品描述长度
      photo_count:
        type: integer
        unit: count
        description: 商品图片数量
      weight_grams:
        type: decimal
        unit: gram
        description: 商品重量
      length_centimeters:
        type: decimal
        unit: centimeter
        description: 商品长度
      height_centimeters:
        type: decimal
        unit: centimeter
        description: 商品高度
      width_centimeters:
        type: decimal
        unit: centimeter
        description: 商品宽度

  commerce.Payment:
    grain: [order_id, sequence]
    description: 每笔订单支付记录一条记录
    fields:
      order_id:
        type: string
        nullable: false
        description: 所属订单标识
      sequence:
        type: integer
        nullable: false
        description: 支付记录在订单内的序号
      method:
        type: string
        nullable: false
        description: 支付方式
      installment_count:
        type: integer
        nullable: false
        unit: count
        description: 分期数量
      amount:
        type: decimal
        nullable: false
        unit: money
        description: 支付金额

  commerce.Review:
    grain: [review_id]
    description: 每条订单评价一条记录
    fields:
      review_id:
        type: string
        nullable: false
        description: 评价标识
      order_id:
        type: string
        nullable: false
        description: 所属订单标识
      score:
        type: integer
        nullable: false
        unit: stars
        description: 评价星级分数
      title:
        type: string
        description: 评价标题
      body:
        type: string
        description: 评价正文
      created_at:
        type: datetime
        nullable: false
        timeSemantics: 评价创建事件时间
      answered_at:
        type: datetime
        timeSemantics: 评价回复事件时间

  commerce.GeoLocation:
    grain: [postal_code_prefix, latitude, longitude]
    description: 每个邮编地理坐标点一条记录
    fields:
      postal_code_prefix:
        type: string
        nullable: false
        description: 邮编前缀
      latitude:
        type: decimal
        nullable: false
        unit: degree
        description: 纬度
      longitude:
        type: decimal
        nullable: false
        unit: degree
        description: 经度
      city:
        type: string
        description: 坐标所在城市
      state:
        type: string
        description: 坐标所在州

  commerce.CategoryTranslation:
    grain: [category_code]
    description: 每个商品品类翻译一条记录
    fields:
      category_code:
        type: string
        nullable: false
        description: 原始品类编码或名称
      translated_name:
        type: string
        nullable: false
        description: 翻译后的品类名称
      target_locale:
        type: string
        nullable: false
        description: 翻译目标语言区域

relationships:
  - name: commerce.order_item_order
    fromEntity: commerce.OrderItem
    toEntity: commerce.Order
    cardinality: many_to_one
    fromFields: [order_id]
    toFields: [order_id]
  - name: commerce.order_customer
    fromEntity: commerce.Order
    toEntity: commerce.Customer
    cardinality: many_to_one
    fromFields: [customer_id]
    toFields: [customer_id]
  - name: commerce.order_item_product
    fromEntity: commerce.OrderItem
    toEntity: commerce.Product
    cardinality: many_to_one
    fromFields: [product_id]
    toFields: [product_id]
  - name: commerce.order_item_seller
    fromEntity: commerce.OrderItem
    toEntity: commerce.Seller
    cardinality: many_to_one
    fromFields: [seller_id]
    toFields: [seller_id]
  - name: commerce.payment_order
    fromEntity: commerce.Payment
    toEntity: commerce.Order
    cardinality: many_to_one
    fromFields: [order_id]
    toFields: [order_id]
  - name: commerce.review_order
    fromEntity: commerce.Review
    toEntity: commerce.Order
    cardinality: many_to_one
    fromFields: [order_id]
    toFields: [order_id]
  - name: commerce.product_category_translation
    fromEntity: commerce.Product
    toEntity: commerce.CategoryTranslation
    cardinality: many_to_one
    fromFields: [category_code]
    toFields: [category_code]
  - name: commerce.customer_geolocation
    fromEntity: commerce.Customer
    toEntity: commerce.GeoLocation
    cardinality: many_to_many
    fromFields: [postal_code_prefix]
    toFields: [postal_code_prefix]
