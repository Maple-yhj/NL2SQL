metrics:
  commerce.gmv:
    aggregation: sum
    inputs:
      - commerce.OrderItem.item_price
      - commerce.OrderItem.freight_amount
    combine: add
    eventTime: commerce.OrderItem.shipping_limit_at
    description: 商品价格与运费金额之和的总和
  commerce.order_count:
    aggregation: count_distinct
    inputs:
      - commerce.OrderItem.order_id
    description: 去重订单数量
  commerce.average_item_price:
    aggregation: average
    inputs:
      - commerce.OrderItem.item_price
    description: 商品项平均价格
  commerce.average_review_score:
    aggregation: average
    inputs:
      - commerce.Review.score
    description: 平均评价星级分数
