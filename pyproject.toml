[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-langgraph"
version = "0.1.0"
description = "A secure NL2SQL workflow built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "langchain>=1.2",
  "langchain-google-genai>=4.2",
  "langchain-openai>=1.1",
  "langgraph>=1.2",
  "pgvector>=0.4",
  "pydantic>=2.11,<3",
  "psycopg2-binary>=2.9",
  "PyYAML>=6.0",
  "PyJWT>=2.10",
  "pwdlib[argon2]>=0.2",
  "python-dotenv>=1.1",
  "sqlglot>=30.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "langgraph-cli[inmem]>=0.4",
]
memory = ["graphiti-core>=0.19"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["data_agent*"]
