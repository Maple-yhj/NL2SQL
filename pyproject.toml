[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"
description = "A governed, configuration-driven Data Agent runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30",
  "duckdb>=1.5,<2",
  "fastapi>=0.115",
  "langchain>=1.2",
  "langchain-anthropic>=1.0",
  "langchain-google-genai>=4.2",
  "langchain-openai>=1.1",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.11,<3",
  "openpyxl>=3.1,<4",
  "PyJWT>=2.10",
  "pwdlib[argon2]>=0.2",
  "python-dotenv>=1.1",
  "python-multipart>=0.0.20",
  "sqlglot>=30.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "langgraph-cli[inmem]>=0.4",
  "pytest>=8.3",
]

[project.scripts]
data-agent = "data_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["data_agent*", "api*"]
