[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"
description = "A governed, configuration-driven Data Agent runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30",
  "duckdb>=1.5,<2",
  "fastapi>=0.115",
  "langchain>=1.2",
  "langchain-anthropic>=1.0",
  "langchain-google-genai>=4.2",
  "langchain-openai>=1.1",
  "langgraph>=1.2",
  "pydantic>=2.11,<3",
  "openpyxl>=3.1,<4",
  "psycopg2-binary>=2.9",
  "PyYAML>=6.0",
  "PyJWT>=2.10",
  "pwdlib[argon2]>=0.2",
  "python-dotenv>=1.1",
  "python-multipart>=0.0.20",
  "sqlglot>=30.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "langgraph-cli[inmem]>=0.4",
  "pytest>=8.3",
]

[project.scripts]
data-agent = "data_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["data_agent*", "api*"]

[tool.setuptools.data-files]
"share/data-agent/packs/domains/commerce" = [
  "packs/domains/commerce/pack.yaml",
  "packs/domains/commerce/semantic-model.yaml",
  "packs/domains/commerce/metrics.yaml",
  "packs/domains/commerce/vocabulary.zh-CN.yaml",
  "packs/domains/commerce/policies.yaml",
  "packs/domains/commerce/evals.yaml",
]
"share/data-agent/packs/enterprises/olist" = [
  "packs/enterprises/olist/pack.yaml",
  "packs/enterprises/olist/pack.lock",
]
"share/data-agent/packs/deployments" = ["packs/deployments/olist-local.yaml"]
"share/data-agent" = ["schema_catalog.json"]
"share/data-agent/generated/bundles" = ["generated/bundles/olist-local.json"]
"share/data-agent/generated/semantic" = ["generated/semantic/commerce.json"]
